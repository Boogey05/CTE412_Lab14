# Purpose: production services point at blue; preview service points at green
# Apply: kubectl apply -f manifests/bluegreen/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: notice-board
  namespace: nb-02230132
spec:
  selector:
    app: notice-board
    slot: blue # <-- the ONLY field that changes on a switch
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-ext
  namespace: nb-02230132
spec:
  type: NodePort
  selector:
    app: notice-board
    slot: blue # <-- switch this too
  ports:
    - port: 80
      targetPort: http
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-preview
  namespace: nb-02230132
spec:
  selector:
    app: notice-board
    slot: green # preview always targets green
  ports:
    - port: 80
      targetPort: http
