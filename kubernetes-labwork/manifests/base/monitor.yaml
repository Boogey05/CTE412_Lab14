# Purpose: permanent availability monitor hitting /version every 0.5 s, one line per request
# Apply: kubectl apply -f manifests/base/monitor.yaml
apiVersion: v1
kind: Pod
metadata:
  name: monitor
  namespace: nb-02230132
spec:
  containers:
    - name: monitor
      image: busybox:1.36 # busybox is explicitly allowed by the brief
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            BODY=$(wget -qO- --timeout=2 http://notice-board/version 2>&1)
            if [ $? -eq 0 ]; then
              echo "$TS OK $BODY"
            else
              echo "$TS FAIL $BODY"
            fi
            sleep 0.5
          done
      resources:
        requests:
          cpu: 10m # tiny, must coexist with 6 app pods inside quota
          memory: 16Mi
