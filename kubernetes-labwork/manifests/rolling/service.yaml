# Purpose: ClusterIP + NodePort services exposing notice-board
# Apply: kubectl apply -f manifests/rolling/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: notice-board
  namespace: nb-02230132
spec:
  selector:
    app: notice-board
  ports:
    - port: 80
      targetPort: http # named port keeps Service independent of the number
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-ext
  namespace: nb-02230132
spec:
  type: NodePort
  selector:
    app: notice-board
  ports:
    - port: 80
      targetPort: http
      nodePort: 30090 # must match the kind extraPortMappings
